# Construit l'APK Android de Ludo Dogon à chaque envoi sur la branche main
# (ou à la demande depuis l'onglet « Actions »), puis le publie dans une
# « Release » : il suffit d'ouvrir la page Releases sur le téléphone et de
# télécharger le fichier .apk.
name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version de Flutter
        run: flutter --version

      - name: Générer les fichiers Android manquants
        run: |
          flutter create --platforms=android --org com.bminformatix --project-name ludo_dogon .
          # Mémoire adaptée aux machines de GitHub.
          sed -i 's/-Xmx[0-9]*[GgMm]/-Xmx4G/' android/gradle.properties || true
          cat android/gradle.properties

      - name: Dépendances
        run: flutter pub get

      - name: Analyse du code
        id: analyse
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyse.log

      - name: Tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test 2>&1 | tee tests.log

      - name: Construire l'APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Signaler l'erreur de construction dans un ticket
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "La construction n°${GITHUB_RUN_NUMBER} a échoué."
            echo
            echo '```'
            flutter --version 2>&1 | head -n 4
            echo '```'
            echo
            echo "Fin du journal :"
            echo
            echo '```'
            tail -n 180 build.log 2>/dev/null || echo "(pas de journal)"
            echo '```'
          } > rapport.md
          gh issue create --title "Échec de construction n°${GITHUB_RUN_NUMBER}" --body-file rapport.md

      - name: Nommer l'APK universel
        id: apk
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          NAME="LudoDogon-v${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "base=LudoDogon-v${VERSION}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Construire les APK légers (un par processeur)
        run: |
          flutter build apk --release --split-per-abi
          B="${{ steps.apk.outputs.base }}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$B-arm64-recent.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$B-armv7-ancien.apk"
          ls -lh LudoDogon-*.apk

      - name: Garder les APK dans les artefacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.apk.outputs.base }}
          path: LudoDogon-*.apk

      - name: Publier la Release (téléchargement depuis le téléphone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          APK Android de Ludo Dogon. Sur le téléphone : télécharger **un seul** fichier ci-dessous, l'ouvrir et autoriser l'installation.

          - `…-arm64-recent.apk` (le plus léger) : la plupart des téléphones achetés depuis 2018.
          - `…-armv7-ancien.apk` : téléphones anciens ou d'entrée de gamme.
          - `….apk` sans suffixe (plus lourd) : fonctionne partout, en cas de doute.

          Pour installer une nouvelle version, désinstaller d'abord l'ancienne.
          NOTES
          gh release create "${{ steps.apk.outputs.tag }}" LudoDogon-*.apk \
            --title "Ludo Dogon ${{ steps.apk.outputs.tag }}" \
            --notes-file notes.md \
            --latest

      - name: Signaler un problème d'analyse ou de tests
        if: steps.analyse.outcome == 'failure' || steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Construction n°${GITHUB_RUN_NUMBER} : l'APK est publié, mais l'analyse ou les tests signalent un problème."
            echo
            echo "Analyse : ${{ steps.analyse.outcome }} — Tests : ${{ steps.tests.outcome }}"
            echo
            echo '```'
            tail -n 60 analyse.log 2>/dev/null
            echo '---'
            tail -n 80 tests.log 2>/dev/null
            echo '```'
          } > qualite.md
          gh issue create --title "Analyse ou tests n°${GITHUB_RUN_NUMBER}" --body-file qualite.md
